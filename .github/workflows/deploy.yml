name: Deploy — Form of Learning

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Deploy Worker + Durable Object ─────────────────────────────────────────
  deploy-worker:
    name: Worker + D1
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run D1 migrations
        run: pnpm exec wrangler d1 migrations apply form-of-learning --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Deploy Worker
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  # ── Deploy UI to Cloudflare Pages ─────────────────────────────────────────
  deploy-ui:
    name: UI (Cloudflare Pages)
    runs-on: ubuntu-latest
    needs: deploy-worker
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build UI
        run: pnpm build
        env:
          VITE_API_URL: https://form-of-learning.workers.dev

      - name: Deploy to Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken:    ${{ secrets.CF_API_TOKEN }}
          accountId:   ${{ secrets.CF_ACCOUNT_ID }}
          projectName: form-of-learning
          directory:   ui/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
